<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>QZIX COIN — 3D Glass Vault</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 28%,#183653,#091725 58%,#040a12);color:#eef5ff;font-family:system-ui,sans-serif}
#stage{position:relative;width:100%;height:100%;touch-action:pan-y}canvas{display:block;width:100%;height:100%;touch-action:pan-y}
.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#b5c9da;font-size:12px;pointer-events:none;text-shadow:0 2px 8px #000}
.controls{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:2;flex-wrap:wrap}
button{border:1px solid #54c9df88;border-radius:10px;padding:9px 13px;background:linear-gradient(#1d4967,#102b41);color:#effaff;font-weight:750;font-size:12px}
button.primary{background:linear-gradient(#087f8f,#075363)}
#status{position:absolute;top:54px;left:8px;right:8px;text-align:center;color:#9db9ca;font-size:11px;pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="stage">
 <div class="controls"><button id="auto" class="primary">Automatic: ON</button><button id="shake">Gentle Shake</button><button id="reset">Reset Notes</button></div>
 <div id="status">Clear crystal glass · Newtonian motion: gravity · inertia · collisions · action & reaction</div>
 <div class="hint">Drag with your finger or mouse to rotate the glass vault</div>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RectAreaLightUniformsLib} from 'three/addons/lights/RectAreaLightUniformsLib.js';
import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';
const stage=document.getElementById('stage'), status=document.getElementById('status');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,stage.clientWidth/stage.clientHeight,.1,100);camera.position.set(0,.2,7.7);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.25));renderer.setSize(stage.clientWidth,stage.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.22;renderer.physicallyCorrectLights=true;stage.appendChild(renderer.domElement);
const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;RectAreaLightUniformsLib.init();
scene.add(new THREE.HemisphereLight(0xffffff,0x6d7782,.92));
const key=new THREE.DirectionalLight(0xffffff,2.6);key.position.set(-3,5,6);scene.add(key);
const strip1=new THREE.RectAreaLight(0xffffff,7.5,5.2,.34);strip1.position.set(-3.2,2.1,2.8);strip1.lookAt(0,0,0);scene.add(strip1);
const strip2=new THREE.RectAreaLight(0xe8f4ff,6.2,4.4,.28);strip2.position.set(3.1,-.7,2.5);strip2.lookAt(0,0,0);scene.add(strip2);
const strip3=new THREE.RectAreaLight(0xffffff,5.2,.28,4.8);strip3.position.set(-2.4,-1.4,-2.4);strip3.lookAt(0,0,0);scene.add(strip3);
const rim=new THREE.PointLight(0xffffff,13,14);rim.position.set(3,1,3);scene.add(rim);
const blue=new THREE.PointLight(0xe8f2ff,8,12);blue.position.set(-4,-2,-2);scene.add(blue);
const vault=new THREE.Group();scene.add(vault);
// Thick, physically shaded crystal shell with studio reflections and visible edge highlights.
const shellGeo=new THREE.SphereGeometry(2.05,64,48);
const glass=new THREE.Mesh(shellGeo,new THREE.MeshPhysicalMaterial({
 color:0xffffff,metalness:0.02,roughness:.012,transmission:1,thickness:.025,ior:1.52,
 envMapIntensity:3.4,clearcoat:1,clearcoatRoughness:.008,
 attenuationColor:0xffffff,attenuationDistance:1000,side:THREE.DoubleSide
}));vault.add(glass);
// Neutral-white acrylic edge reflections: clear centre, polished thick rim.
const innerRim=new THREE.Mesh(new THREE.SphereGeometry(2.018,64,48),new THREE.MeshBasicMaterial({color:0xdceeff,side:THREE.BackSide,transparent:true,opacity:.012,depthWrite:false}));vault.add(innerRim);
const edge=new THREE.Mesh(new THREE.SphereGeometry(2.058,64,48),new THREE.MeshBasicMaterial({color:0xb9d9f5,wireframe:true,transparent:true,opacity:.012}));vault.add(edge);
const arc=new THREE.Mesh(new THREE.TorusGeometry(1.985,.012,8,160,Math.PI*.72),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.88}));arc.position.set(-.1,.08,.24);arc.rotation.set(.45,.2,-.5);vault.add(arc);
const glint=new THREE.Mesh(new THREE.TorusGeometry(2.005,.006,6,140,Math.PI*.26),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.9}));glint.position.set(.04,-.02,.18);glint.rotation.set(1.1,.4,.8);vault.add(glint);
const world=new CANNON.World({gravity:new CANNON.Vec3(0,-3.6,0)});world.broadphase=new CANNON.NaiveBroadphase();world.solver.iterations=10;world.defaultContactMaterial.friction=.24;world.defaultContactMaterial.restitution=.62;
const radius=1.78,wallCount=24;
for(let i=0;i<wallCount;i++){const a=i/wallCount*Math.PI*2,mid=a+Math.PI/wallCount;const b=new CANNON.Body({mass:0});b.addShape(new CANNON.Box(new CANNON.Vec3(.14,.12,1.65)));b.position.set(Math.cos(mid)*radius,Math.sin(mid)*radius,0);b.quaternion.setFromEuler(0,0,mid+Math.PI/2);world.addBody(b)}
for(const z of [-1.55,1.55]){const b=new CANNON.Body({mass:0});b.addShape(new CANNON.Plane());b.position.z=z;b.quaternion.setFromEuler(z<0?Math.PI/2:-Math.PI/2,0,0);world.addBody(b)}
const values=[10,20,15,25,5,25], meshes=[], bodies=[];
function texture(pct,i){
 const c=document.createElement('canvas');c.width=768;c.height=384;const x=c.getContext('2d');
 const palettes=[['#ffe36e','#f6a800'],['#73e6ff','#087bd6'],['#ff9cba','#e93478'],['#c9a2ff','#7138c8'],['#75f0c4','#079b83'],['#ffbd83','#e85a36']];
 const [p1,p2]=palettes[i%palettes.length],g=x.createLinearGradient(0,0,768,384);g.addColorStop(0,p1);g.addColorStop(1,p2);
 x.fillStyle=g;x.fillRect(0,0,768,384);
 // Fine engraved guilloche-style lines and security border.
 x.save();x.strokeStyle='rgba(255,255,255,.30)';x.lineWidth=1.5;
 for(let k=0;k<22;k++){x.beginPath();for(let a=0;a<=Math.PI*2+.01;a+=.04){const r=54+k*5.3,px=384+Math.cos(a)*r,py=190+Math.sin(a)*r*.47;if(a===0)x.moveTo(px,py);else x.lineTo(px,py)}x.stroke()}x.restore();
 x.strokeStyle='rgba(255,255,255,.95)';x.lineWidth=12;x.strokeRect(13,13,742,358);
 x.strokeStyle='rgba(20,35,65,.42)';x.lineWidth=3;x.strokeRect(30,30,708,324);
 x.fillStyle='rgba(255,255,255,.90)';x.beginPath();x.arc(384,184,130,0,Math.PI*2);x.fill();
 x.strokeStyle='rgba(24,33,61,.42)';x.lineWidth=4;x.beginPath();x.arc(384,184,112,0,Math.PI*2);x.stroke();
 x.save();x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';
 x.font='1000 238px system-ui,Arial';x.lineWidth=9;x.strokeStyle='rgba(255,255,255,.98)';x.strokeText(pct+'%',384,192);
 x.shadowColor='rgba(10,20,45,.48)';x.shadowBlur=16;x.shadowOffsetY=7;x.fillStyle='#101a38';x.fillText(pct+'%',384,192);x.restore();
 x.font='1000 29px system-ui,Arial';x.fillStyle='#101a38';x.textAlign='center';x.fillText('QZIX COIN  •  SHARE %',384,310);
 x.font='900 18px Arial';x.textAlign='left';x.fillText('QZIX',52,68);x.textAlign='right';x.fillText('SHARE NOTE',716,68);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t
}
values.forEach((pct,i)=>{const w=.94,h=.47,d=.075;const shape=new THREE.Shape();const rr=.045;shape.moveTo(-w/2+rr,-h/2);shape.lineTo(w/2-rr,-h/2);shape.quadraticCurveTo(w/2,-h/2,w/2,-h/2+rr);shape.lineTo(w/2,h/2-rr);shape.quadraticCurveTo(w/2,h/2,w/2-rr,h/2);shape.lineTo(-w/2+rr,h/2);shape.quadraticCurveTo(-w/2,h/2,-w/2,h/2-rr);shape.lineTo(-w/2,-h/2+rr);shape.quadraticCurveTo(-w/2,-h/2,-w/2+rr,-h/2);
 const geo=new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:true,bevelSegments:2,steps:1,bevelSize:.012,bevelThickness:.012,curveSegments:8});geo.center();
 const noteMat=new THREE.MeshStandardMaterial({map:texture(pct,i),roughness:.62,metalness:.015});
 const mesh=new THREE.Mesh(geo,[noteMat,new THREE.MeshStandardMaterial({color:0xc6b98d,roughness:.72,metalness:.08})]);vault.add(mesh);meshes.push(mesh);const body=new CANNON.Body({mass:.42,linearDamping:.035,angularDamping:.055});body.addShape(new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2)));const a=i/6*Math.PI*2;const z=(i%3-1)*.72;body.position.set(Math.cos(a)*1.02,Math.sin(a)*1.02,z);body.velocity.set(-Math.sin(a)*(.42+i*.035),Math.cos(a)*(.38+i*.025),(i%2?-.22:.22));body.angularVelocity.set(.22*(i+1),.18*(i-2),i%2?.55:-.48);body.updateMassProperties();world.addBody(body);bodies.push(body)});
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enablePan=false;orbit.enableZoom=false;orbit.enableDamping=true;orbit.dampingFactor=.07;orbit.rotateSpeed=.65;renderer.domElement.style.touchAction="pan-y";
let automatic=true,last=performance.now(),acc=0,raf=0,visible=true,lastFrame=0;
const frameInterval=1000/30;
const autoButton=document.getElementById('auto');
const shakeButton=document.getElementById('shake');
const resetButton=document.getElementById('reset');
autoButton.addEventListener('click',()=>{
 automatic=!automatic;
 autoButton.textContent='Automatic: '+(automatic?'ON':'OFF');
 autoButton.classList.toggle('primary',automatic);
});
shakeButton.addEventListener('click',()=>{
 bodies.forEach((b)=>{
  b.applyImpulse(new CANNON.Vec3((Math.random()-.5)*1.25,.45+Math.random()*.85,(Math.random()-.5)*.9),b.position);
  b.angularVelocity.x+=(Math.random()-.5)*2.2;
  b.angularVelocity.y+=(Math.random()-.5)*2.2;
  b.angularVelocity.z+=(Math.random()-.5)*2.2;
 });
});
resetButton.addEventListener('click',()=>{
 bodies.forEach((b,i)=>{
  const a=i/6*Math.PI*2,z=(i%3-1)*.72;
  b.position.set(Math.cos(a)*1.02,Math.sin(a)*1.02,z);
  b.quaternion.setFromEuler(0,0,(i%2?-.12:.12));
  b.velocity.set(-Math.sin(a)*(.42+i*.035),Math.cos(a)*(.38+i*.025),(i%2?-.22:.22));
  b.angularVelocity.set(.22*(i+1),.18*(i-2),i%2?.55:-.48);
  b.force.set(0,0,0);b.torque.set(0,0,0);b.wakeUp();
 });
});
function syncNoteMeshes(){
 bodies.forEach((b,i)=>{
  meshes[i].position.set(b.position.x,b.position.y,b.position.z);
  meshes[i].quaternion.set(b.quaternion.x,b.quaternion.y,b.quaternion.z,b.quaternion.w);
 });
}
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0}}
function startLoop(){if(!raf&&visible&&!document.hidden)raf=requestAnimationFrame(animate)}
function animate(now){
 raf=0;
 if(!visible||document.hidden)return;
 if(now-lastFrame<frameInterval){raf=requestAnimationFrame(animate);return}
 const dt=Math.min((now-last)/1000,.033);last=now;lastFrame=now;acc+=dt;
 while(acc>=1/30){world.step(1/30);acc-=1/30}
 if(automatic){vault.rotation.y+=dt*.16;vault.rotation.x=Math.sin(now*.00025)*.055}
 syncNoteMeshes();orbit.update();renderer.render(scene,camera);
 raf=requestAnimationFrame(animate);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopLoop();else{last=performance.now();startLoop()}});
if('IntersectionObserver' in window){
 const observer=new IntersectionObserver(entries=>{
  visible=entries.some(entry=>entry.isIntersecting);
  if(visible){last=performance.now();startLoop()}else stopLoop();
 },{threshold:.05});
 observer.observe(stage);
}
requestAnimationFrame(animate);
new ResizeObserver(()=>{
 const w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);
 camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);
 if(visible&&!document.hidden)renderer.render(scene,camera);
}).observe(stage);
</script></body></html>
