<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>QZIX COIN — 3D Glass Vault</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 28%,#183653,#091725 58%,#040a12);color:#eef5ff;font-family:system-ui,sans-serif}
#stage{position:relative;width:100%;height:100%;touch-action:none}canvas{display:block;width:100%;height:100%}
.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#b5c9da;font-size:12px;pointer-events:none;text-shadow:0 2px 8px #000}
.controls{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:2;flex-wrap:wrap}
button{border:1px solid #54c9df88;border-radius:10px;padding:9px 13px;background:linear-gradient(#1d4967,#102b41);color:#effaff;font-weight:750;font-size:12px}
button.primary{background:linear-gradient(#087f8f,#075363)}
#status{position:absolute;top:54px;left:8px;right:8px;text-align:center;color:#9db9ca;font-size:11px;pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="stage">
 <div class="controls"><button id="auto" class="primary">Automatic: ON</button><button id="shake">Gentle Shake</button><button id="reset">Reset Notes</button></div>
 <div id="status">3D physics ready · 6 percentage notes</div>
 <div class="hint">Drag with your finger or mouse to rotate the glass vault</div>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RectAreaLightUniformsLib} from 'three/addons/lights/RectAreaLightUniformsLib.js';
import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';
const stage=document.getElementById('stage'), status=document.getElementById('status');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,stage.clientWidth/stage.clientHeight,.1,100);camera.position.set(0,.2,7.7);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(stage.clientWidth,stage.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.22;renderer.physicallyCorrectLights=true;stage.appendChild(renderer.domElement);
const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;RectAreaLightUniformsLib.init();
scene.add(new THREE.HemisphereLight(0xdaf4ff,0x18263a,1.35));
const key=new THREE.DirectionalLight(0xffffff,4.2);key.position.set(-3,5,6);scene.add(key);
const strip1=new THREE.RectAreaLight(0xb9f1ff,5,4.5,.22);strip1.position.set(-3,1.8,2.4);strip1.lookAt(0,0,0);scene.add(strip1);
const strip2=new THREE.RectAreaLight(0xffffff,3.5,3.2,.16);strip2.position.set(3,-.4,2);strip2.lookAt(0,0,0);scene.add(strip2);
const rim=new THREE.PointLight(0x37cfff,35,14);rim.position.set(3,1,3);scene.add(rim);
const blue=new THREE.PointLight(0x5d9dff,24,12);blue.position.set(-4,-2,-2);scene.add(blue);
const vault=new THREE.Group();scene.add(vault);
// Thick, physically shaded crystal shell with studio reflections and visible edge highlights.
const shellGeo=new THREE.SphereGeometry(2.05,128,96);
const glass=new THREE.Mesh(shellGeo,new THREE.MeshPhysicalMaterial({
 color:0xe5f8ff,metalness:0,roughness:.018,transmission:1,thickness:.62,ior:1.48,
 envMapIntensity:1.65,clearcoat:1,clearcoatRoughness:.012,
 attenuationColor:0xb8eaff,attenuationDistance:4.5,side:THREE.DoubleSide
}));vault.add(glass);
// A subtle inner contour gives the glass wall a believable thick edge.
const innerRim=new THREE.Mesh(new THREE.SphereGeometry(2.018,96,72),new THREE.MeshBasicMaterial({color:0x9bdfff,side:THREE.BackSide,transparent:true,opacity:.075}));vault.add(innerRim);
const edge=new THREE.Mesh(new THREE.SphereGeometry(2.058,96,72),new THREE.MeshBasicMaterial({color:0xdaf8ff,wireframe:true,transparent:true,opacity:.045}));vault.add(edge);
const arc=new THREE.Mesh(new THREE.TorusGeometry(1.985,.012,8,160,Math.PI*.72),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.72}));arc.position.set(-.1,.08,.24);arc.rotation.set(.45,.2,-.5);vault.add(arc);
const glint=new THREE.Mesh(new THREE.TorusGeometry(2.005,.006,6,140,Math.PI*.26),new THREE.MeshBasicMaterial({color:0x8ceaff,transparent:true,opacity:.8}));glint.position.set(.04,-.02,.18);glint.rotation.set(1.1,.4,.8);vault.add(glint);
const world=new CANNON.World({gravity:new CANNON.Vec3(0,-2.8,0)});world.broadphase=new CANNON.NaiveBroadphase();world.solver.iterations=12;world.defaultContactMaterial.friction=.42;world.defaultContactMaterial.restitution=.34;
const radius=1.78,wallCount=48;
for(let i=0;i<wallCount;i++){const a=i/wallCount*Math.PI*2,mid=a+Math.PI/wallCount;const b=new CANNON.Body({mass:0});b.addShape(new CANNON.Box(new CANNON.Vec3(.14,.12,1.65)));b.position.set(Math.cos(mid)*radius,Math.sin(mid)*radius,0);b.quaternion.setFromEuler(0,0,mid+Math.PI/2);world.addBody(b)}
for(const z of [-1.55,1.55]){const b=new CANNON.Body({mass:0});b.addShape(new CANNON.Plane());b.position.z=z;b.quaternion.setFromEuler(z<0?Math.PI/2:-Math.PI/2,0,0);world.addBody(b)}
const values=[10,20,15,25,5,25], meshes=[], bodies=[];
function texture(pct,i){
 const c=document.createElement('canvas');c.width=768;c.height=384;const x=c.getContext('2d');
 const palettes=[['#f4fff0','#52c99a'],['#effaff','#4bb6dc'],['#fff6dc','#e6ad45'],['#f5edff','#a58be8'],['#fff0f3','#e47c9b'],['#e8fff9','#46c6b2']];
 const [p1,p2]=palettes[i%4],g=x.createLinearGradient(0,0,768,384);g.addColorStop(0,p1);g.addColorStop(1,p2);
 x.fillStyle=g;x.fillRect(0,0,768,384);
 // Fine engraved guilloche-style lines and security border.
 x.save();x.strokeStyle='rgba(18,65,72,.13)';x.lineWidth=1.5;
 for(let k=0;k<22;k++){x.beginPath();for(let a=0;a<=Math.PI*2+.01;a+=.04){const r=54+k*5.3,px=384+Math.cos(a)*r,py=190+Math.sin(a)*r*.47;if(a===0)x.moveTo(px,py);else x.lineTo(px,py)}x.stroke()}x.restore();
 x.strokeStyle='rgba(255,255,255,.94)';x.lineWidth=10;x.strokeRect(13,13,742,358);
 x.strokeStyle='rgba(13,52,62,.42)';x.lineWidth=3;x.strokeRect(30,30,708,324);
 x.fillStyle='rgba(255,255,255,.58)';x.beginPath();x.arc(384,184,130,0,Math.PI*2);x.fill();
 x.strokeStyle='rgba(15,61,70,.35)';x.lineWidth=3;x.beginPath();x.arc(384,184,112,0,Math.PI*2);x.stroke();
 x.save();x.shadowColor='rgba(7,39,55,.28)';x.shadowBlur=12;x.shadowOffsetY=5;x.fillStyle='#103b4c';x.textAlign='center';x.textBaseline='middle';x.font='900 154px system-ui,Arial';x.fillText(pct+'%',384,176);x.restore();
 x.font='800 25px Arial';x.fillStyle='#174b5b';x.fillText('QZIX COIN  •  PERCENTAGE',384,310);
 x.font='bold 18px Arial';x.textAlign='left';x.fillText('QZIX',52,68);x.textAlign='right';x.fillText('SHARE NOTE',716,68);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t
}
values.forEach((pct,i)=>{const w=.94,h=.47,d=.075;const shape=new THREE.Shape();const rr=.045;shape.moveTo(-w/2+rr,-h/2);shape.lineTo(w/2-rr,-h/2);shape.quadraticCurveTo(w/2,-h/2,w/2,-h/2+rr);shape.lineTo(w/2,h/2-rr);shape.quadraticCurveTo(w/2,h/2,w/2-rr,h/2);shape.lineTo(-w/2+rr,h/2);shape.quadraticCurveTo(-w/2,h/2,-w/2,h/2-rr);shape.lineTo(-w/2,-h/2+rr);shape.quadraticCurveTo(-w/2,-h/2,-w/2+rr,-h/2);
 const geo=new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:true,bevelSegments:2,steps:1,bevelSize:.012,bevelThickness:.012,curveSegments:8});geo.center();
 const noteMat=new THREE.MeshStandardMaterial({map:texture(pct,i),roughness:.62,metalness:.015});
 const mesh=new THREE.Mesh(geo,[noteMat,new THREE.MeshStandardMaterial({color:0xc6b98d,roughness:.72,metalness:.08})]);vault.add(mesh);meshes.push(mesh);const body=new CANNON.Body({mass:.42,linearDamping:.12,angularDamping:.18});body.addShape(new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2)));const a=i/6*Math.PI*2;body.position.set(Math.cos(a)*.72,Math.sin(a)*.78,i%2?.48:-.48);body.velocity.set((i-2.5)*.16,(2-i)*.12,i%2?.08:-.08);body.angularVelocity.set(.1*(i+1),.12*(i-2),i%2?.2:-.2);world.addBody(body);bodies.push(body)});
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enablePan=false;orbit.enableZoom=false;orbit.enableDamping=true;orbit.dampingFactor=.07;orbit.rotateSpeed=.65;
let automatic=true,last=performance.now(),acc=0;
document.getElementById('auto').onclick=()=>{automatic=!automatic;document.getElementById('auto').textContent='Automatic: '+(automatic?'ON':'OFF');document.getElementById('auto').classList.toggle('primary',automatic);status.textContent=automatic?'Automatic movement enabled':'Automatic vault rotation paused; physics continues'};
document.getElementById('shake').onclick=()=>{bodies.forEach(b=>b.applyImpulse(new CANNON.Vec3((Math.random()-.5)*1.3,Math.random()*1.1,(Math.random()-.5)*.8),b.position));status.textContent='Gentle movement applied'};
document.getElementById('reset').onclick=()=>{bodies.forEach((b,i)=>{const a=i/6*Math.PI*2;b.position.set(Math.cos(a)*.72,Math.sin(a)*.78,i%2?.48:-.48);b.velocity.set(0,0,0);b.angularVelocity.set(0,0,0);b.quaternion.set(0,0,0,1)});status.textContent='Notes reset to starting positions'};
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.033);last=now;acc+=dt;while(acc>=1/60){world.step(1/60);acc-=1/60}if(automatic){vault.rotation.y+=dt*.16;vault.rotation.x=Math.sin(now*.00025)*.055}bodies.forEach((b,i)=>{meshes[i].position.set(b.position.x,b.position.y,b.position.z);meshes[i].quaternion.set(b.quaternion.x,b.quaternion.y,b.quaternion.z,b.quaternion.w)});orbit.update();renderer.render(scene,camera)}
requestAnimationFrame(animate);
new ResizeObserver(()=>{const w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}).observe(stage);
</script></body></html>
